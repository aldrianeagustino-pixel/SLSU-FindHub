<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLSU-JGE Lost & Found Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-boxes-stacked text-3xl"></i>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">SLSU-JGE Lost & Found</h1>
                    <p class="text-xs text-indigo-200">Official Student & Faculty Portal</p>
                </div>
            </div>
            <nav class="flex space-x-2">
                <button id="navBrowseBtn" onclick="switchTab('browse')" class="px-4 py-2 rounded-lg bg-indigo-800 font-medium text-sm transition">
                    <i class="fa-solid fa-magnifying-glass mr-2"></i>Browse Items
                </button>
                <button id="navReportBtn" onclick="switchTab('report')" class="px-4 py-2 rounded-lg hover:bg-indigo-600 font-medium text-sm transition">
                    <i class="fa-solid fa-plus-circle mr-2"></i>Report Item
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">

        <!-- ================= BROWSE TAB ================= -->
        <section id="browseTab">
            <!-- Search & Filters -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-8 flex flex-col gap-4">
                
                <div class="flex flex-col md:flex-row gap-4 justify-between items-center">
                    <!-- Search Input -->
                    <div class="relative w-full md:w-1/2">
                        <i class="fa-solid fa-search absolute left-3 top-3.5 text-slate-400"></i>
                        <input type="text" id="searchInput" oninput="filterItems()" placeholder="Search by name, description, or location..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <!-- Category Dropdown -->
                    <select id="categorySelect" onchange="filterItems()" class="w-full md:w-auto px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="ID/Documents">ID/Documents</option>
                        <option value="Keys">Keys</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Bags">Bags</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Dual Filter Row: Item Type & Role Filter -->
                <div class="flex flex-wrap items-center justify-between gap-4 border-t border-slate-100 pt-3">
                    <!-- Type Filter Buttons -->
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-semibold text-slate-400 uppercase mr-1">Status:</span>
                        <button onclick="setTypeFilter('ALL')" id="filterTypeAll" class="type-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white">All</button>
                        <button onclick="setTypeFilter('LOST')" id="filterTypeLost" class="type-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Lost</button>
                        <button onclick="setTypeFilter('FOUND')" id="filterTypeFound" class="type-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200">Found</button>
                    </div>

                    <!-- Role Filter Buttons (Student vs Teacher) -->
                    <div class="flex items-center space-x-2">
                        <span class="text-xs font-semibold text-slate-400 uppercase mr-1">Filter by User:</span>
                        <button onclick="setRoleFilter('ALL')" id="filterRoleAll" class="role-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-700 text-white">Everyone</button>
                        <button onclick="setRoleFilter('STUDENT')" id="filterRoleStudent" class="role-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200"><i class="fa-solid fa-user-graduate mr-1"></i>Students</button>
                        <button onclick="setRoleFilter('TEACHER')" id="filterRoleTeacher" class="role-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200"><i class="fa-solid fa-chalkboard-user mr-1"></i>Teachers/Staff</button>
                    </div>
                </div>

            </div>

            <!-- Items Grid -->
            <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Dynamic cards populated by JavaScript -->
            </div>

            <!-- Empty State Message -->
            <div id="noResults" class="hidden text-center py-12">
                <i class="fa-solid fa-ghost text-5xl text-slate-300 mb-3"></i>
                <p class="text-slate-500 text-lg">No active lost or found records right now.</p>
            </div>
        </section>


        <!-- ================= REPORT ITEM TAB ================= -->
        <section id="reportTab" class="hidden max-w-2xl mx-auto">
            <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold mb-2 text-slate-800">Report a Lost or Found Item</h2>
                <p class="text-slate-500 text-sm mb-6">Fill out the form below to register an item record.</p>

                <form id="reportForm" onsubmit="handleFormSubmit(event)">
                    <div class="space-y-4">
                        
                        <!-- Role Selector (Student vs Teacher) -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">I am a: *</label>
                            <div class="grid grid-cols-2 gap-4">
                                <label class="flex items-center justify-center p-3 border rounded-lg cursor-pointer transition hover:bg-slate-50 [&:has(:checked)]:border-indigo-600 [&:has(:checked)]:bg-indigo-50/50">
                                    <input type="radio" name="userRole" value="STUDENT" checked class="text-indigo-600 focus:ring-indigo-500">
                                    <span class="ml-2 text-sm font-medium text-slate-700"><i class="fa-solid fa-user-graduate mr-1.5 text-indigo-600"></i>Student</span>
                                </label>
                                <label class="flex items-center justify-center p-3 border rounded-lg cursor-pointer transition hover:bg-slate-50 [&:has(:checked)]:border-indigo-600 [&:has(:checked)]:bg-indigo-50/50">
                                    <input type="radio" name="userRole" value="TEACHER" class="text-indigo-600 focus:ring-indigo-500">
                                    <span class="ml-2 text-sm font-medium text-slate-700"><i class="fa-solid fa-chalkboard-user mr-1.5 text-indigo-600"></i>Teacher / Staff</span>
                                </label>
                            </div>
                        </div>

                        <!-- Listing Type -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Status Type *</label>
                            <div class="flex space-x-4">
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="itemType" value="LOST" checked class="text-indigo-600 focus:ring-indigo-500">
                                    <span class="ml-2 text-sm font-semibold text-rose-600">I Lost Something</span>
                                </label>
                                <label class="flex items-center cursor-pointer">
                                    <input type="radio" name="itemType" value="FOUND" class="text-indigo-600 focus:ring-indigo-500">
                                    <span class="ml-2 text-sm font-semibold text-emerald-600">I Found Something</span>
                                </label>
                            </div>
                        </div>

                        <!-- Item Title -->
                        <div>
                            <label for="title" class="block text-sm font-medium text-slate-700 mb-1">Item Name / Title *</label>
                            <input type="text" id="title" required placeholder="e.g. Blue Hydro Flask, Student ID Card" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- Category -->
                            <div>
                                <label for="category" class="block text-sm font-medium text-slate-700 mb-1">Category *</label>
                                <select id="category" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                    <option value="">Select Category</option>
                                    <option value="Electronics">Electronics</option>
                                    <option value="ID/Documents">ID/Documents</option>
                                    <option value="Keys">Keys</option>
                                    <option value="Clothing">Clothing</option>
                                    <option value="Bags">Bags</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                            <!-- Location -->
                            <div>
                                <label for="location" class="block text-sm font-medium text-slate-700 mb-1">Location *</label>
                                <input type="text" id="location" required placeholder="e.g. Faculty Room, Library 2nd Floor" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            </div>
                        </div>

                        <!-- Date -->
                        <div>
                            <label for="date" class="block text-sm font-medium text-slate-700 mb-1">Date (Lost or Found) *</label>
                            <input type="date" id="date" required class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <!-- Image Upload Field -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1"><i class="fa-solid fa-camera text-indigo-600 mr-1"></i> Upload Photo </label>
                            <div class="flex items-center justify-center w-full">
                                <label for="imageUpload" class="flex flex-col items-center justify-center w-full h-36 border-2 border-slate-300 border-dashed rounded-lg cursor-pointer bg-slate-50 hover:bg-slate-100 transition relative overflow-hidden">
                                    <div id="uploadPrompt" class="flex flex-col items-center justify-center pt-5 pb-6">
                                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-indigo-500 mb-2"></i>
                                        <p class="text-xs text-slate-600 font-medium"><span class="font-bold text-indigo-600">Click to upload</span> or drag picture here</p>
                                        <p class="text-[10px] text-slate-400 mt-1">PNG, JPG, JPEG or WEBP</p>
                                    </div>
                                    <img id="imagePreview" class="hidden absolute inset-0 w-full h-full object-cover rounded-lg" alt="Preview">
                                    <input id="imageUpload" type="file" accept="image/*" class="hidden" onchange="handleImagePreview(event)">
                                </label>
                            </div>
                        </div>

                        <!-- Description -->
                        <div>
                            <label for="description" class="block text-sm font-medium text-slate-700 mb-1">Detailed Description *</label>
                            <textarea id="description" rows="3" required placeholder="Describe distinct features, stickers, contents, brand, color, etc." class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                        </div>

                        <!-- Contact Info -->
                        <div>
                            <label for="contact" class="block text-sm font-medium text-slate-700 mb-1">Your Contact Email/Phone *</label>
                            <input type="text" id="contact" required placeholder="name@univ.edu or (555) 000-0000" class="w-full p-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow-sm transition mt-4">
                            Submit & Record Listing
                        </button>
                    </div>
                </form>
            </div>
        </section>

    </main>

    <!-- Item Details Modal -->
    <div id="itemModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 relative overflow-hidden">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl z-10">&times;</button>
            <div id="modalContent">
                <!-- Injected via JavaScript -->
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Default Mock Data
        const initialItems = [
            {
                id: 1,
                userRole: "STUDENT",
                title: "MacBook Air M2 (Space Gray)",
                type: "LOST",
                category: "Electronics",
                location: "Central Library, 3rd Floor",
                date: "2026-09-08",
                description: "Has a yellow anime sticker on the top shell. Left inside a black laptop sleeve.",
                contact: "alex.m@univ.edu",
                image: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80"
            },
            {
                id: 2,
                userRole: "TEACHER",
                title: "Wireless Presenter Pointer",
                type: "FOUND",
                category: "Electronics",
                location: "Science Building Room 302",
                date: "2026-09-09",
                description: "Black Logitech laser presenter pointer found on the podium desk after lecture.",
                contact: "prof.smith@univ.edu",
                image: null
            }
        ];

        // Load items from LocalStorage or fallback to defaults
        let items = JSON.parse(localStorage.getItem('campus_items')) || initialItems;
        let currentTypeFilter = 'ALL';
        let currentRoleFilter = 'ALL';
        let currentImageData = null;

        document.addEventListener('DOMContentLoaded', () => {
            saveAndRender();
        });

        function saveAndRender() {
            localStorage.setItem('campus_items', JSON.stringify(items));
            filterItems();
        }

        function switchTab(tab) {
            const browseTab = document.getElementById('browseTab');
            const reportTab = document.getElementById('reportTab');
            const navBrowseBtn = document.getElementById('navBrowseBtn');
            const navReportBtn = document.getElementById('navReportBtn');

            if (tab === 'browse') {
                browseTab.classList.remove('hidden');
                reportTab.classList.add('hidden');
                navBrowseBtn.className = "px-4 py-2 rounded-lg bg-indigo-800 font-medium text-sm transition";
                navReportBtn.className = "px-4 py-2 rounded-lg hover:bg-indigo-600 font-medium text-sm transition";
            } else {
                browseTab.classList.add('hidden');
                reportTab.classList.remove('hidden');
                navReportBtn.className = "px-4 py-2 rounded-lg bg-indigo-800 font-medium text-sm transition";
                navBrowseBtn.className = "px-4 py-2 rounded-lg hover:bg-indigo-600 font-medium text-sm transition";
            }
        }

        // Processing Image File to Data URL
        function handleImagePreview(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageData = e.target.result;
                    const preview = document.getElementById('imagePreview');
                    preview.src = currentImageData;
                    preview.classList.remove('hidden');
                    document.getElementById('uploadPrompt').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function renderItems(data) {
            const grid = document.getElementById('itemsGrid');
            const noResults = document.getElementById('noResults');
            grid.innerHTML = '';

            if (data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            } else {
                noResults.classList.add('hidden');
            }

            data.forEach(item => {
                const isLost = item.type === 'LOST';
                const isTeacher = item.userRole === 'TEACHER';
                
                const badgeColor = isLost ? 'bg-rose-100 text-rose-700 border-rose-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200';
                const roleBadge = isTeacher 
                    ? `<span class="px-2 py-0.5 text-[10px] font-bold rounded bg-amber-100 text-amber-800 border border-amber-200"><i class="fa-solid fa-chalkboard-user mr-1"></i>Teacher/Staff</span>`
                    : `<span class="px-2 py-0.5 text-[10px] font-bold rounded bg-sky-100 text-sky-800 border border-sky-200"><i class="fa-solid fa-user-graduate mr-1"></i>Student</span>`;
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between overflow-hidden";
                
                // Display Uploaded Photo OR Default Icon Box
                const imageContainer = item.image 
                    ? `<img src="${item.image}" class="w-full h-44 object-cover" alt="Item photo">` 
                    : `<div class="w-full h-36 bg-slate-100 flex flex-col items-center justify-center text-slate-400 gap-1"><i class="fa-solid fa-image text-3xl"></i><span class="text-[10px]">No photo uploaded</span></div>`;

                card.innerHTML = `
                    <div>
                        <div class="relative">
                            ${imageContainer}
                        </div>
                        <div class="p-5">
                            <div class="flex items-center justify-between gap-1 mb-3">
                                <span class="px-2.5 py-0.5 text-xs font-bold rounded-full border ${badgeColor}">
                                    ${item.type}
                                </span>
                                ${roleBadge}
                            </div>
                            <h3 class="font-bold text-slate-800 text-lg mb-1 line-clamp-1">${escapeHtml(item.title)}</h3>
                            <p class="text-xs text-indigo-600 font-semibold mb-3">${escapeHtml(item.category)}</p>
                            <p class="text-slate-600 text-sm mb-4 line-clamp-2">${escapeHtml(item.description)}</p>
                            
                            <div class="space-y-1.5 text-xs text-slate-500">
                                <div class="flex items-center"><i class="fa-solid fa-location-dot w-4 text-slate-400"></i><span class="truncate">${escapeHtml(item.location)}</span></div>
                                <div class="flex items-center"><i class="fa-solid fa-calendar w-4 text-slate-400"></i><span>${item.date}</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex gap-2">
                        <button onclick="openModal(${item.id})" class="flex-1 py-1.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 text-xs font-semibold rounded-lg transition">
                            Details
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Type Filter Controls
        function setTypeFilter(type) {
            currentTypeFilter = type;
            document.querySelectorAll('.type-filter-btn').forEach(btn => {
                btn.className = "type-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200";
            });
            if(type === 'ALL') document.getElementById('filterTypeAll').className = "type-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white";
            if(type === 'LOST') document.getElementById('filterTypeLost').className = "type-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white";
            if(type === 'FOUND') document.getElementById('filterTypeFound').className = "type-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-indigo-600 text-white";

            filterItems();
        }

        // Role Filter Controls (Student vs Teacher)
        function setRoleFilter(role) {
            currentRoleFilter = role;
            document.querySelectorAll('.role-filter-btn').forEach(btn => {
                btn.className = "role-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200";
            });
            if(role === 'ALL') document.getElementById('filterRoleAll').className = "role-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-700 text-white";
            if(role === 'STUDENT') document.getElementById('filterRoleStudent').className = "role-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-sky-600 text-white";
            if(role === 'TEACHER') document.getElementById('filterRoleTeacher').className = "role-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-600 text-white";

            filterItems();
        }

        function filterItems() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            const categoryQuery = document.getElementById('categorySelect').value;

            const filtered = items.filter(item => {
                const matchesType = currentTypeFilter === 'ALL' || item.type === currentTypeFilter;
                const matchesRole = currentRoleFilter === 'ALL' || item.userRole === currentRoleFilter;
                const matchesCategory = categoryQuery === 'ALL' || item.category === categoryQuery;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery) || 
                                      item.description.toLowerCase().includes(searchQuery) || 
                                      item.location.toLowerCase().includes(searchQuery);

                return matchesType && matchesRole && matchesCategory && matchesSearch;
            });

            renderItems(filtered);
        }

        // Handle Report Form Submit
        function handleFormSubmit(e) {
            e.preventDefault();
            
            const newItem = {
                id: Date.now(),
                userRole: document.querySelector('input[name="userRole"]:checked').value,
                title: document.getElementById('title').value,
                type: document.querySelector('input[name="itemType"]:checked').value,
                category: document.getElementById('category').value,
                location: document.getElementById('location').value,
                date: document.getElementById('date').value,
                description: document.getElementById('description').value,
                contact: document.getElementById('contact').value,
                image: currentImageData
            };

            items.unshift(newItem);
            
            // Reset form
            document.getElementById('reportForm').reset();
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('uploadPrompt').classList.remove('hidden');
            currentImageData = null;
            
            saveAndRender();
            switchTab('browse');
        }

        // Modal Functionality
        function openModal(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;

            const modalContent = document.getElementById('modalContent');
            const badgeColor = item.type === 'LOST' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700';
            const roleBadge = item.userRole === 'TEACHER'
                ? `<span class="px-2 py-0.5 text-xs font-bold rounded bg-amber-100 text-amber-800"><i class="fa-solid fa-chalkboard-user mr-1"></i>Teacher / Staff Record</span>`
                : `<span class="px-2 py-0.5 text-xs font-bold rounded bg-sky-100 text-sky-800"><i class="fa-solid fa-user-graduate mr-1"></i>Student Record</span>`;

            const imageDisplay = item.image 
                ? `<img src="${item.image}" class="w-full h-52 object-cover rounded-lg mb-4" alt="Item preview">` 
                : '';

            modalContent.innerHTML = `
                ${imageDisplay}
                <div class="mb-3 flex justify-between items-center flex-wrap gap-2">
                    <span class="px-2.5 py-1 text-xs font-bold rounded-full ${badgeColor}">${item.type}</span>
                    ${roleBadge}
                </div>
                <h3 class="text-xl font-bold text-slate-800 mb-1">${escapeHtml(item.title)}</h3>
                <p class="text-xs text-indigo-600 font-semibold mb-3">${escapeHtml(item.category)}</p>
                <p class="text-slate-600 text-sm mb-4">${escapeHtml(item.description)}</p>
                
                <div class="bg-slate-50 p-4 rounded-lg space-y-2 text-sm border border-slate-100 mb-4">
                    <div class="flex items-center text-slate-600"><i class="fa-solid fa-location-dot w-6 text-indigo-500"></i><strong>Location:</strong>&nbsp;${escapeHtml(item.location)}</div>
                    <div class="flex items-center text-slate-600"><i class="fa-solid fa-calendar w-6 text-indigo-500"></i><strong>Date:</strong>&nbsp;${item.date}</div>
                </div>

                <div class="border-t pt-3 mb-4">
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Contact Information</p>
                    <p class="text-indigo-600 font-bold text-md select-all">${escapeHtml(item.contact)}</p>
                </div>

                <div class="flex gap-2">
                    <button onclick="deleteItem(${item.id})" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg transition flex items-center justify-center gap-1.5">
                        <i class="fa-solid fa-circle-check"></i> Mark as Claimed / Resolved (Remove)
                    </button>
                </div>
            `;

            document.getElementById('itemModal').classList.remove('hidden');
        }

        // Delete Item Functionality
        function deleteItem(id) {
            items = items.filter(item => item.id !== id);
            saveAndRender();
            closeModal();
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
